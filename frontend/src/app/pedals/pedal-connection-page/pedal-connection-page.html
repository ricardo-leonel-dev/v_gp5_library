<div *transloco="let t" class="mx-auto max-w-3xl px-4 py-10">
  <h1 class="text-2xl font-semibold text-slate-900 dark:text-slate-100">{{ t('pedal.title') }}</h1>

  @if (!supported) {
    <p class="mt-4 text-sm text-slate-600 dark:text-slate-400">{{ t('pedal.unsupported') }}</p>
  } @else {
    <button
      type="button"
      (click)="connect()"
      [disabled]="connecting()"
      data-testid="connect-button"
      class="mt-4 rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500 disabled:opacity-50"
    >
      {{ t('pedal.connect') }}
    </button>

    <p class="mt-4 text-sm text-slate-600 dark:text-slate-400" data-testid="connection-state">
      {{ t('pedal.' + stateLabelKey()) }}
    </p>

    @if (error()) {
      <p class="mt-2 text-sm text-red-600 dark:text-red-400" data-testid="connection-error">
        {{ t('pedal.' + error()) }}
      </p>
    }
  }
</div>
