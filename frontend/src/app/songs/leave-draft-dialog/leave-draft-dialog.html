<div
  *transloco="let t"
  class="contents"
  data-testid="leave-draft-dialog"
>
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"
    data-testid="leave-draft-backdrop"
    (click)="onBackdropClick()"
  >
    <div
      class="flex w-full max-w-md flex-col overflow-hidden rounded-xl bg-white shadow-xl dark:bg-slate-800"
      data-testid="leave-draft-card"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      (click)="onCardClick($event)"
    >
      <header
        class="flex items-start justify-between gap-3 border-b border-slate-200 px-4 py-3 dark:border-slate-700 sm:px-5"
      >
        <h2
          [id]="titleId"
          class="text-base font-semibold text-slate-900 dark:text-slate-100"
          data-testid="leave-draft-title"
        >
          {{ t('songPresetDraft.leave_title') }}
        </h2>
      </header>

      <div class="px-4 py-4 sm:px-5" data-testid="leave-draft-body">
        <p class="text-sm text-slate-600 dark:text-slate-300" data-testid="leave-draft-message">
          {{ t('songPresetDraft.leave_message', { name: draftName() }) }}
        </p>
      </div>

      <footer
        class="flex flex-wrap justify-end gap-2 border-t border-slate-200 px-4 py-3 dark:border-slate-700 sm:px-5"
      >
        <button
          #stayBtn
          type="button"
          class="rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
          data-testid="leave-draft-stay"
          (click)="onStay()"
        >
          {{ t('songPresetDraft.leave_stay') }}
        </button>
        <button
          type="button"
          class="rounded-md bg-white px-3 py-1.5 text-sm font-medium text-red-700 ring-1 ring-inset ring-red-300 hover:bg-red-50 dark:bg-transparent dark:text-red-300 dark:ring-red-800 dark:hover:bg-red-950/60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
          data-testid="leave-draft-leave"
          (click)="onLeave()"
        >
          {{ t('songPresetDraft.leave_confirm') }}
        </button>
      </footer>
    </div>
  </div>
</div>
