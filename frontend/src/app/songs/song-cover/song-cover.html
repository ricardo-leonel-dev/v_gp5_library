<div
  *transloco="let t"
  class="relative aspect-square w-full overflow-hidden bg-slate-200 ring-1 ring-inset ring-slate-900/5 dark:bg-slate-800 dark:ring-white/10"
  [class.animate-pulse]="isLoading()"
  [class.motion-reduce:animate-none]="isLoading()"
  [class.w-32]="size() === 'hero'"
  [class.shrink-0]="size() === 'hero'"
  [class.sm:w-40]="size() === 'hero'"
  [class.rounded-lg]="size() === 'hero'"
  [class.rounded-md]="size() === 'tile'"
  data-testid="song-cover"
  [attr.data-cover-state]="state()"
>
  @if (state() === 'loaded' && url(); as u) {
    <img
      [src]="u"
      [alt]="t('songs.cover_alt', { name: songName() })"
      class="absolute inset-0 size-full object-cover"
      data-testid="song-cover-image"
    />
  }
  @if (state() === 'none' || state() === 'error') {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="absolute inset-0 m-auto size-1/3 text-slate-400 dark:text-slate-500"
      aria-hidden="true"
      data-testid="song-cover-placeholder"
    >
      <path
        d="M12 21c-1.6 0-7-6.8-7-11.6C5 5.6 8.1 3 12 3s7 2.6 7 6.4C19 14.2 13.6 21 12 21z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
    </svg>
  }
</div>
