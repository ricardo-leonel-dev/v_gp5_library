<div *transloco="let t" class="min-h-screen bg-slate-50 dark:bg-slate-900">
  <header class="flex items-center justify-end gap-2 border-b border-slate-200 px-4 py-2 dark:border-slate-700">
    <app-language-switcher />
    <app-dark-mode-toggle />
    <!-- v6 ghost-link mock-data control (chrome variant A winner from
         the playground). Replaces v5's indigo filled button; now lives
         in the page header so the production chrome stays clean. -->
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-md px-2 py-1 text-xs font-medium text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500"
      data-testid="load-mock-presets"
      (click)="loadMockPresets()"
    >
      <svg viewBox="0 0 16 16" class="size-3.5" aria-hidden="true">
        <path d="M 8 2 V 10 M 4 7 L 8 11 L 12 7 M 2 13 H 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>{{ t('presetBrowser.load_test_presets') }}</span>
    </button>
  </header>
  <router-outlet />
</div>
