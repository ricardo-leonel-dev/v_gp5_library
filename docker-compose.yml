services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gp5_library
    ports:
      - "5432:5432"
    volumes:
      - gp5_postgres_data:/var/lib/postgresql/data

volumes:
  gp5_postgres_data:
